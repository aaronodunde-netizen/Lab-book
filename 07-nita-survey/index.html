<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NITA-U Uganda National IT Skills Assessment 2026</title>
  <link rel="stylesheet" href="survey.css">
</head>
<body>
  <header>
    <img src="uganda-coat-of-arms.png" alt="Uganda coat of arms" style="max-width:80px;">
    <h1>National Information Technology Authority — Uganda</h1>
  </header>
  <div class="banner-wrap">
    <img src="survey-banner.jpg" alt="Uganda National IT Skills Assessment 2026 banner" class="banner">
    <h2 class="overlay">Uganda National IT Skills Assessment 2026</h2>
  </div>
  <div class="steps">
    <div class="step current">Step 1 — Respondent Details</div>
    <div class="step">Step 2 — Skills Assessment</div>
    <div class="step">Step 3 — Submit</div>
  </div>
  <form>
    <fieldset>
      <legend>Respondent Details</legend>
      <div class="form-group">
        <label for="title">Title</label>
        <select id="title" name="title">
          <option>Mr</option>
          <option>Mrs</option>
          <option>Ms</option>
          <option>Dr</option>
        </select>
      </div>
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required minlength="4">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" pattern="\+256[0-9]{9}" placeholder="+256700000000">
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob">
      </div>
      <div class="form-group">
        <label>Gender</label>
        <label for="gender-male"><input type="radio" id="gender-male" name="gender" value="Male"> Male</label>
        <label for="gender-female"><input type="radio" id="gender-female" name="gender" value="Female"> Female</label>
        <label for="gender-na"><input type="radio" id="gender-na" name="gender" value="Prefer not to say"> Prefer not to say</label>
      </div>
      <div class="form-group">
        <label for="region">Region</label>
        <select id="region" name="region">
          <option>Central</option>
          <option>Eastern</option>
          <option>Northern</option>
          <option>Western</option>
        </select>
      </div>
      <div class="form-group">
        <label>Respondent Category</label>
        <label for="cat-ict"><input type="radio" id="cat-ict" name="category" value="ICT Professional"> ICT Professional</label>
        <label for="cat-gov"><input type="radio" id="cat-gov" name="category" value="Government Officer"> Government Officer</label>
        <label for="cat-student"><input type="radio" id="cat-student" name="category" value="Student"> Student</label>
      </div>
      <button type="submit">Submit</button>
    </fieldset>
  </form>
</body>
</html>
