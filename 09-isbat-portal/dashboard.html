      font-size: 18px;

  </style>

<body>
  <div class="sidebar">
    <img src="isbat-logo.png" alt="ISBAT University">
    <p>Joan Nakato</p>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="courses.html">My Courses</a>
      <a href="fees.html">Fee Statement</a>
    </nav>
  </div>
  <div class="main">
    <h1>Welcome, Joan Nakato</h1>

    <p>Status: <span class="badge" style="background:#EAF3DE; color:#27500A; padding:4px 10px;">Active</span></p>
    <div class="metrics">
      <div class="metric">
